plugins {
 id 'java-library'
 id 'net.minecraftforge.gradle' version '6.0.54'
}
version=project.mod_version
group='com.arthou.qsmpchatformat'
base { archivesName='qsmp-chat-format-forge-1211' }
java { toolchain.languageVersion=JavaLanguageVersion.of(21); withSourcesJar() }
minecraft { mappings channel:'official',version:minecraft_version }
repositories { mavenCentral(); maven { url='https://maven.minecraftforge.net/' } }
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
tasks.named('processResources',ProcessResources) {
 def props=[minecraft_version:minecraft_version,minecraft_version_range:minecraft_version_range,forge_version:forge_version,forge_version_range:forge_version_range,loader_version_range:loader_version_range,mod_id:mod_id,mod_name:mod_name,mod_license:mod_license,mod_version:mod_version,mod_authors:mod_authors,mod_description:mod_description]
 inputs.properties props
 filesMatching('META-INF/mods.toml') { expand props }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8';options.release=21 }
// Forge 1.21.1 runs official names; the normal jar is the production artifact.
jar { from('LICENSE') }
sourceSets.test { compileClasspath+=sourceSets.main.compileClasspath;runtimeClasspath+=sourceSets.main.runtimeClasspath }
tasks.register('verifyChatFormat',JavaExec) { dependsOn testClasses;classpath=sourceSets.test.runtimeClasspath;mainClass='com.arthou.qsmpchatformat.ChatFormatVerification';maxHeapSize='384m' }
tasks.named('check') { dependsOn 'verifyChatFormat' }
